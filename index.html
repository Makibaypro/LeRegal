<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le régale</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="16x16" href="./src/LOGOR.png">
    <link href="https://fonts.cdnfonts.com/css/le-murmure" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/fragment-mono" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/general-sans" rel="stylesheet">

</head>
<body>
    <header>
        <img src="./src/Logo.png" alt="Logo Le Régal" />
        <nav>
            <a>Le cinéma</a>
            <a>Nos services</a>
            <a>Nous trouver</a>
        </nav>
    </header>
    <main>
        <table>
            <colgroup>
            </colgroup>
            <caption>
                Programme de la semaine
            </caption>
            <thead>
                <tr>
                    <th scope="col">Film</th>
                    <th scope="col">Jour</th>
                    <th scope="col">Horaire</th>
                    <th scope="col">Salle</th>
                    <th scope="col">Version</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>L'étrange noël de Monsieur Jack</td>
                    <td>Mardi</td>
                    <td>18h00</td>
                    <td>Grande salle</td>
                    <td>VF</td>
                <tr>
                </tr>
                    <td>Porco Rosso</td>
                    <td>Jeudi</td>
                    <td>18h45</td>
                    <td>Grande salle</td>
                    <td>VF</td>
                </tr>
                <tr>
                    <td>Leon</td>
                    <td>Samedi</td>
                    <td>21h00</td>
                    <td>Petite salle</td>
                    <td>VF</td>
                </tr>
                <tr>
                    <td>The book of Eli</td>
                    <td>Dimanche</td>
                    <td>19h30</td>
                    <td>Grande salle</td>
                    <td>VOST</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="5" scope="row">4 séances cette semaine</th>
                </tr>
            </tfoot>
        </table>
    </main>
    <footer>
        <a></a>
    </footer>

    
</body>
</html>
